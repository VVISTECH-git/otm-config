<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTM Config Table Picker — TMS</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#fbfcfe; --ink:#182029; --muted:#616d7b;
    --line:#e4e8ee; --accent:#3457d5; --accent-weak:#edf1fd; --ok:#0e8a6a; --zero:#98a2af;
    --gtm:#7c3aed; --gtm-weak:#f1ebfe; --txn:#b45309; --bad:#c0392b;
    --shadow:0 1px 2px rgba(20,30,48,.05),0 2px 6px rgba(20,30,48,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1319;--panel:#151c25;--panel-2:#121821;--ink:#e7edf3;--muted:#8f9dab;
      --line:#242f3b;--accent:#6f9bff;--accent-weak:#182538;--ok:#3fc79a;--zero:#5a6572;
      --gtm:#b9a3f5;--gtm-weak:#241b3a;--txn:#f0a44e;--bad:#f0776a;--shadow:0 1px 2px rgba(0,0,0,.4);}
  }
  :root[data-theme="light"]{--bg:#f5f7fa;--panel:#ffffff;--panel-2:#fbfcfe;--ink:#182029;--muted:#616d7b;--line:#e4e8ee;--accent:#3457d5;--accent-weak:#edf1fd;--ok:#0e8a6a;--zero:#98a2af;--gtm:#7c3aed;--gtm-weak:#f1ebfe;--txn:#b45309;--bad:#c0392b;}
  :root[data-theme="dark"]{--bg:#0e1319;--panel:#151c25;--panel-2:#121821;--ink:#e7edf3;--muted:#8f9dab;--line:#242f3b;--accent:#6f9bff;--accent-weak:#182538;--ok:#3fc79a;--zero:#5a6572;--gtm:#b9a3f5;--gtm-weak:#241b3a;--txn:#f0a44e;--bad:#f0776a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:15px 22px 13px;box-shadow:var(--shadow)}
  .htop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:640}
  .scope{font-size:12px;color:var(--muted)} .scope b{color:var(--accent)}
  .lede{color:var(--muted);font-size:12.5px;margin-top:4px}
  .lede code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .runstat{color:var(--muted);font-size:12px;margin-top:8px} .runstat b{color:var(--ink)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:86px}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:660;font-variant-numeric:tabular-nums;margin-top:1px}
  .stat.cfg .v{color:var(--accent)} .stat.mst .v{color:var(--ok)} .stat.txn .v{color:var(--txn)} .stat.sel .v{color:var(--gtm)}
  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:13px}
  input[type=search],select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  input[type=search]{flex:1;min-width:170px}
  input[type=search]:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  label.tg{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;cursor:pointer}
  main{padding:16px 22px 64px}
  .msg{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px;background:var(--panel-2)}
  .msg b{color:var(--ink)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;background:var(--panel);min-width:660px}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.plain{cursor:default}
  tbody tr{border-left:3px solid transparent}
  tbody tr:hover{background:var(--accent-weak)}
  tbody tr.sel{background:var(--accent-weak);border-left-color:var(--accent)}
  td.name{font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:-.1px}
  td.cnt{font-weight:600} td.cnt.zero{color:var(--zero);font-weight:400}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
  .chip.gtm{color:var(--gtm);background:var(--gtm-weak)}
  .chip.otm{color:var(--muted);background:var(--panel-2);border:1px solid var(--line)}
  select.cat{padding:4px 6px;font-size:12px;font-weight:600;border-radius:7px}
  select.cat.cfg{color:var(--accent)} select.cat.mst{color:var(--ok)} select.cat.txn{color:var(--txn)}
  .arrow{font-size:9px;margin-left:3px;opacity:.7}
  .foot{color:var(--muted);font-size:12px;margin-top:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:20}
  #toast.show{opacity:1} #toast.ok{background:var(--ok);color:#fff} #toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="htop">
    <h1>OTM Configuration Table Picker</h1>
    <span class="scope">domain <b>TMS</b> · <span id="objcount">…</span></span>
  </div>
  <div class="lede">Live from the API. <b>Category</b> and the <b>selection checkbox</b> save to the database as you change them. <b>Type</b> is by name prefix (<code>GTM_</code> = GTM).</div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter table name…" aria-label="Filter table name">
    <select id="catFilter" aria-label="Filter by category">
      <option value="">All categories</option><option>Configuration</option><option>Master</option><option>Transactional</option>
    </select>
    <select id="typeFilter" aria-label="Filter by type">
      <option value="">All types</option><option value="OTM">OTM only</option><option value="GTM">GTM only</option>
    </select>
    <label class="tg"><input type="checkbox" id="hideEmpty" checked> hide empty</label>
    <label class="tg"><input type="checkbox" id="onlySel"> only selected</label>
    <button class="ghost" id="refreshBtn">Refresh</button>
    <button class="ghost" id="sweepBtn">Count sweep</button>
    <button id="runBtn">Run extraction</button>
    <button class="ghost" id="xlsxBtn">Download .xlsx</button>
    <button class="ghost" id="exportBtn">Export list (JSON)</button>
  </div>
  <div id="runStatus" class="runstat"></div>
</header>
<main>
  <div id="msg" class="msg">Connecting to the API… (free-tier server may take ~30–60s to wake)</div>
  <div id="tablewrap" class="tablewrap" style="display:none">
    <table>
      <thead><tr>
        <th class="plain" style="width:38px" aria-label="select"></th>
        <th data-sort="name">Table<span class="arrow"></span></th>
        <th data-sort="cat">Category<span class="arrow"></span></th>
        <th data-sort="type">Type<span class="arrow"></span></th>
        <th class="num" data-sort="count">TMS rows<span class="arrow"></span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="foot"><span id="footL"></span><span id="footR"></span></div>
</main>
</div>
<div id="toast"></div>
<script>
// API base — same Render project. Override with ?api=... if you fork it.
const API=new URLSearchParams(location.search).get("api")||"https://otm-config-api.onrender.com";
const CATS=["Master","Configuration","Transactional"];
const CLS={Configuration:"cfg",Master:"mst",Transactional:"txn"};
const $=id=>document.getElementById(id);
const nf=n=>Number(n||0).toLocaleString();
const isGtm=t=>t.startsWith("GTM_")||t.startsWith("W_GTM_");
const typeOf=t=>isGtm(t)?"GTM":"OTM";
let DATA=[];               // [{name,count,enabled,category}]
let byName={};
let sortKey="count",sortDir=-1;
let toastTimer;
function toast(m,kind){clearTimeout(toastTimer);const t=$("toast");t.textContent=m;t.className="show"+(kind?(" "+kind):"");toastTimer=setTimeout(()=>t.className="",1800);}

async function api(path,opts){const r=await fetch(API+path,opts);if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));return r.json();}

async function load(){
  $("msg").style.display="block";$("msg").innerHTML="Connecting to the API… (free-tier server may take ~30–60s to wake)";
  $("tablewrap").style.display="none";
  try{
    const rows=await api("/api/tables");
    DATA=rows.map(r=>({name:r.table_name,count:Number(r.tms_row_count||0),enabled:!!r.enabled,category:r.category||"Configuration"}));
    byName={};DATA.forEach(d=>byName[d.name]=d);
    $("objcount").textContent=nf(DATA.length)+" objects";
    if(DATA.length===0){
      $("msg").innerHTML="<b>The manifest is empty.</b><br>Click <b>Run count sweep</b> to pull every TMS table's row count from OTM. This takes a few minutes.";
      $("tablewrap").style.display="none";stats();
    }else{
      $("msg").style.display="none";$("tablewrap").style.display="";stats();render();
    }
  }catch(e){
    $("msg").innerHTML="<b>Couldn't reach the API.</b><br>"+e.message+"<br><br>Retrying is safe — click Refresh.";
  }
}

function view(){
  const q=$("q").value.trim().toUpperCase(),he=$("hideEmpty").checked,os=$("onlySel").checked,cf=$("catFilter").value,tf=$("typeFilter").value;
  let r=DATA.filter(d=>{
    if(q&&!d.name.includes(q))return false;
    if(cf&&d.category!==cf)return false;
    if(tf&&typeOf(d.name)!==tf)return false;
    if(os&&!d.enabled)return false;
    if(he&&d.count===0&&!d.enabled)return false;
    return true;
  });
  r.sort((a,b)=>{
    if(sortKey==="name")return sortDir*a.name.localeCompare(b.name);
    if(sortKey==="type")return sortDir*(typeOf(a.name).localeCompare(typeOf(b.name))||a.name.localeCompare(b.name));
    if(sortKey==="cat")return sortDir*(a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
    return sortDir*(a.count-b.count)||a.name.localeCompare(b.name);
  });
  return r;
}
function catSelect(d){
  const opt=v=>`<option ${v===d.category?"selected":""}>${v}</option>`;
  return `<select class="cat ${CLS[d.category]}" data-t="${d.name}">${CATS.map(opt).join("")}</select>`;
}
function render(){
  const rows=view();
  $("rows").innerHTML=rows.map(d=>{
    const g=isGtm(d.name);
    return `<tr class="${d.enabled?'sel':''}" data-t="${d.name}">
      <td><input type="checkbox" class="cb" ${d.enabled?'checked':''} aria-label="select ${d.name}"></td>
      <td class="name">${d.name}</td>
      <td>${catSelect(d)}</td>
      <td><span class="chip ${g?'gtm':'otm'}">${g?'GTM':'OTM'}</span></td>
      <td class="num cnt ${d.count===0?'zero':''}">${nf(d.count)}</td></tr>`;
  }).join("");
  $("footL").textContent=`${nf(rows.length)} shown`;
  $("footR").textContent=`Changes save to the database automatically`;
  document.querySelectorAll(".cb").forEach(cb=>cb.onchange=async e=>{
    const t=e.target.closest("tr").dataset.t,d=byName[t];d.enabled=e.target.checked;
    e.target.closest("tr").classList.toggle("sel",d.enabled);stats();
    try{await api("/api/tables/"+encodeURIComponent(t),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:d.enabled})});toast("Saved","ok");}
    catch(err){d.enabled=!d.enabled;toast("Save failed","bad");render();}
  });
  document.querySelectorAll(".cat").forEach(s=>s.onchange=async e=>{
    const t=e.target.dataset.t,d=byName[t],v=e.target.value,prev=d.category;d.category=v;e.target.className="cat "+CLS[v];stats();
    try{await api("/api/tables/"+encodeURIComponent(t),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({category:v})});toast("Saved","ok");}
    catch(err){d.category=prev;toast("Save failed","bad");render();}
  });
  document.querySelectorAll("th[data-sort]").forEach(th=>{th.querySelector(".arrow").textContent=th.dataset.sort===sortKey?(sortDir<0?"▼":"▲"):"";});
}
function stats(){
  const c={Configuration:0,Master:0,Transactional:0};let sel=0;
  DATA.forEach(d=>{c[d.category]=(c[d.category]||0)+1;if(d.enabled)sel++;});
  const tiles=[["Total",DATA.length,""],["Configuration",c.Configuration,"cfg"],["Master",c.Master,"mst"],["Transactional",c.Transactional,"txn"],["Selected",sel,"sel"]];
  $("stats").innerHTML=tiles.map(t=>`<div class="stat ${t[2]}"><div class="k">${t[0]}</div><div class="v">${nf(t[1])}</div></div>`).join("");
}
document.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=k==="count"?-1:1;}render();});
["q","catFilter","typeFilter","hideEmpty","onlySel"].forEach(id=>$(id).addEventListener("input",()=>DATA.length&&render()));
$("refreshBtn").onclick=load;
$("sweepBtn").onclick=async()=>{
  if(!confirm("Run a full count sweep against OTM? Takes a few minutes."))return;
  $("sweepBtn").disabled=true;toast("Sweep started…");
  try{
    await api("/api/count-sweep",{method:"POST"});
    let last=-1,stable=0;
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,5000));
      const rows=await api("/api/tables");
      $("objcount").textContent=nf(rows.length)+" objects (sweeping…)";
      if(rows.length===last){if(++stable>=3)break;}else{stable=0;last=rows.length;}
    }
    toast("Sweep finished","ok");
  }catch(e){toast("Sweep error: "+e.message,"bad");}
  $("sweepBtn").disabled=false;load();
};
$("exportBtn").onclick=()=>{
  const chosen=DATA.filter(d=>d.enabled).sort((a,b)=>a.name.localeCompare(b.name))
    .map(d=>({table:d.name,category:d.category,type:typeOf(d.name),tms_rows:d.count}));
  const blob=new Blob([JSON.stringify({domain:"TMS",generated:new Date().toISOString(),count:chosen.length,tables:chosen},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tms_config_tables.json";a.click();
};
function showLastRun(r){
  const el=$("runStatus");if(!el)return;
  if(!r){el.textContent="";return;}
  const when=r.finished_at?new Date(r.finished_at).toLocaleString():"in progress…";
  el.innerHTML=`Last extraction: <b>${r.status||"running"}</b> · ${r.tables_fetched||0} tables · ${nf(r.records_upserted||0)} records · ${when}`+
    (r.error?` · <span style="color:var(--bad)">${r.error.slice(0,80)}</span>`:"");
}
async function loadLastRun(){try{const runs=await api("/api/runs");showLastRun(runs[0]);}catch{}}
$("runBtn").onclick=async()=>{
  const sel=DATA.filter(d=>d.enabled).length;
  if(!sel){toast("Select at least one table first","bad");return;}
  if(!confirm(`Run extraction for ${sel} selected table(s)? This pulls their TMS rows into the store.`))return;
  $("runBtn").disabled=true;toast("Extraction started…");
  try{
    await api("/api/runs",{method:"POST"});
    let last=null;
    for(let i=0;i<90;i++){
      await new Promise(r=>setTimeout(r,4000));
      const runs=await api("/api/runs");last=runs[0];showLastRun(last);
      if(last&&last.finished_at){toast(`Run ${last.status}: ${last.tables_fetched} tables, ${nf(last.records_upserted)} records`,last.status==="error"?"bad":"ok");break;}
    }
  }catch(e){toast("Run failed: "+e.message,"bad");}
  $("runBtn").disabled=false;
};
$("xlsxBtn").onclick=async()=>{
  $("xlsxBtn").disabled=true;toast("Building workbook…");
  try{
    const r=await fetch(API+"/api/export");if(!r.ok)throw new Error("HTTP "+r.status);
    const blob=await r.blob();const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="otm_config_TMS.xlsx";a.click();toast("Downloaded","ok");
  }catch(e){toast("Export failed: "+e.message,"bad");}
  $("xlsxBtn").disabled=false;
};
load();loadLastRun();
</script>
</body>
</html>
